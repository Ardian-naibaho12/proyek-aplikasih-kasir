<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#262626" stroke-width="6"/>

  <!-- Scanner Frame Outer Corners -->
  <path d="M 120 180 L 120 140 A 20 20 0 0 1 140 120 L 180 120" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 332 120 L 372 120 A 20 20 0 0 1 392 140 L 392 180" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 120 332 L 120 372 A 20 20 0 0 0 140 392 L 180 392" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 332 392 L 372 392 A 20 20 0 0 0 392 372 L 392 332" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Barcode Vertical Lines -->
  <rect x="160" y="160" width="14" height="192" rx="7" fill="#ffffff"/>
  <rect x="190" y="160" width="8" height="192" rx="4" fill="#ffffff"/>
  <rect x="214" y="160" width="22" height="192" rx="8" fill="#ffffff"/>
  <rect x="252" y="160" width="10" height="192" rx="5" fill="#ffffff"/>
  <rect x="278" y="160" width="18" height="192" rx="7" fill="#ffffff"/>
  <rect x="312" y="160" width="12" height="192" rx="6" fill="#ffffff"/>
  <rect x="338" y="160" width="14" height="192" rx="7" fill="#ffffff"/>

  <!-- Horizontal Laser Scan Line with Glow -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="#10b981" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="100" y1="256" x2="412" y2="256" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round"/>

  <!-- Small Shopping Cart & Tag Badge -->
  <circle cx="392" cy="392" r="64" fill="#059669"/>
  <path d="M 372 384 L 380 384 L 388 404 L 408 404 L 414 392 L 384 392" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="388" cy="412" r="3" fill="#ffffff"/>
  <circle cx="406" cy="412" r="3" fill="#ffffff"/>
</svg>
